<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataLens charts</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101318;
      --panel: #171c23;
      --panel-2: #202731;
      --border: #323c48;
      --text: #eef3f8;
      --muted: #9aa6b5;
      --accent: #4aa3ff;
      --warning: #f7b955;
      --chart-bg: #1f2022;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .file-warning {
      padding: 10px 18px;
      color: #121416;
      background: var(--warning);
      font-weight: 700;
    }

    .toolbar {
      z-index: 10;
      background: rgba(23, 28, 35, 0.98);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-inner {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 16px clamp(14px, 2.8vw, 28px);
      display: grid;
      grid-template-columns: minmax(220px, 420px) minmax(360px, 1fr);
      gap: 14px 18px;
      align-items: end;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
    }

    select,
    input,
    .date-trigger {
      width: 100%;
      min-width: 0;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #0f1318;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      outline: none;
      padding: 9px 13px;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--text) 50%),
        linear-gradient(135deg, var(--text) 50%, transparent 50%);
      background-position:
        calc(100% - 22px) calc(50% - 3px),
        calc(100% - 14px) calc(50% - 3px);
      background-repeat: no-repeat;
      background-size: 8px 8px;
      padding-right: 48px;
    }

    select:focus,
    input:focus,
    .date-trigger:focus,
    button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 163, 255, 0.2);
    }

    .event-controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 54px 54px minmax(54px, auto);
      gap: 10px;
      align-items: center;
    }

    .date-picker {
      position: relative;
      min-width: 0;
    }

    .date-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      cursor: pointer;
    }

    .date-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .weekday-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(74, 163, 255, 0.42);
      border-radius: 999px;
      color: #dcecff;
      background: #17304a;
      font-size: 13px;
      font-weight: 850;
      line-height: 1;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .date-trigger::after {
      content: "";
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--text);
      border-bottom: 2px solid var(--text);
      transform: rotate(45deg) translateY(-2px);
      flex: 0 0 auto;
      opacity: 0.85;
    }

    .calendar-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 20;
      width: min(330px, calc(100vw - 28px));
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0f1318;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
    }

    .calendar-header {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-month {
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      text-transform: capitalize;
    }

    .calendar-nav {
      width: 38px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel-2);
      font: inherit;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .calendar-nav:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .calendar-weekday {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
    }

    .calendar-weekdays {
      margin-bottom: 7px;
    }

    .calendar-day {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text);
      background: #141a21;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .calendar-day:hover {
      border-color: var(--accent);
      background: #1c2835;
    }

    .calendar-day.is-selected {
      border-color: var(--accent);
      background: #164a78;
      font-weight: 800;
    }

    .calendar-day.is-today {
      border-color: rgba(74, 163, 255, 0.65);
    }

    .calendar-day:disabled,
    .calendar-day.is-empty {
      color: #5d6671;
      background: #101318;
      border-color: transparent;
      cursor: not-allowed;
      opacity: 0.65;
    }

    .icon-button {
      width: 54px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--panel-2);
      font: inherit;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
    }

    .icon-button:hover {
      border-color: var(--accent);
      background: #243140;
    }

    .icon-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .position {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      text-align: right;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px clamp(12px, 2.8vw, 28px) 28px;
      overscroll-behavior: contain;
    }

    .charts {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .chart {
      min-width: 0;
      border: 1px solid #252c35;
      border-radius: 8px;
      overflow: hidden;
      background: var(--chart-bg);
    }

    .block-divider {
      height: 24px;
      position: relative;
      margin: 0;
    }

    .block-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #323c48;
    }

    .block-divider::after {
      content: "";
      position: absolute;
      top: calc(50% - 2px);
      left: 50%;
      width: 112px;
      height: 4px;
      border-radius: 999px;
      background: #4aa3ff;
      transform: translateX(-50%);
    }

    .chart-title {
      margin: 0;
      padding: 13px 16px 8px;
      color: #d6d8dc;
      background: var(--chart-bg);
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
    }

    .chart-frame-wrap {
      position: relative;
      height: 430px;
      background: var(--chart-bg);
    }

    .chart-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--chart-bg);
      pointer-events: none;
    }

    @media (min-width: 980px) {
      .chart-frame {
        height: 100%;
      }

      .chart-frame-wrap {
        height: 460px;
      }
    }

    @media (max-width: 860px) {
      .toolbar-inner {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .toolbar-inner {
        padding: 14px;
        gap: 12px;
      }

      select,
      input,
      .date-trigger {
        height: 46px;
        font-size: 16px;
      }

      .weekday-badge {
        min-width: 78px;
        height: 26px;
        padding-inline: 8px;
        font-size: 12px;
      }

      .event-controls {
        grid-template-columns: minmax(0, 1fr) 48px 48px;
        gap: 8px;
      }

      .position {
        grid-column: 1 / -1;
        justify-self: end;
        padding-right: 2px;
      }

      .icon-button {
        width: 48px;
        height: 46px;
      }

      .calendar-popover {
        width: min(318px, calc(100vw - 20px));
      }

      .workspace {
        padding: 12px 10px 22px;
      }

      .charts {
        gap: 12px;
      }

      .chart-title {
        padding: 12px 14px 6px;
        font-size: 16px;
      }

      .chart-frame-wrap {
        height: 400px;
      }
    }

    @media (max-width: 390px) {
      .toolbar-inner {
        padding: 12px 10px;
      }

      .event-controls {
        grid-template-columns: minmax(0, 1fr) 44px 44px;
      }

      .icon-button {
        width: 44px;
      }

      .workspace {
        padding-inline: 6px;
      }

      .chart-frame-wrap {
        height: 380px;
      }
    }
  </style>
</head>
<body tabindex="-1">
  <main class="app">
    <div class="file-warning" id="fileWarning" hidden>Откройте страницу через http://localhost:8080, не как локальный файл.</div>

    <section class="toolbar" aria-label="Фильтры графиков">
      <div class="toolbar-inner">
        <div class="field">
          <label for="ticketCategory">ticket_category</label>
          <select id="ticketCategory">
            <option value="">Все</option>
            <option value="VIP">VIP</option>
            <option value="Балкон Общая">Балкон Общая</option>
            <option value="Партер 1 Фланг">Партер 1 Фланг</option>
            <option value="Партер 1 Центр">Партер 1 Центр</option>
            <option value="Партер 2 Общая">Партер 2 Общая</option>
            <option value="Партер 3 Общая">Партер 3 Общая</option>
          </select>
        </div>

        <div class="field">
          <label for="eventDate">event date</label>
          <div class="event-controls">
            <div class="date-picker" id="eventDatePicker">
              <button class="date-trigger" id="eventDate" type="button" aria-haspopup="dialog" aria-expanded="false">
                <span class="date-value" id="eventDateValue"></span>
                <span class="weekday-badge" id="weekdayBadge"></span>
              </button>
              <div class="calendar-popover" id="eventCalendar" role="dialog" aria-label="event date" hidden>
                <div class="calendar-header">
                  <button class="calendar-nav" id="prevMonth" type="button" aria-label="Предыдущий месяц">‹</button>
                  <div class="calendar-month" id="calendarMonth"></div>
                  <button class="calendar-nav" id="nextMonth" type="button" aria-label="Следующий месяц">›</button>
                </div>
                <div class="calendar-weekdays" aria-hidden="true">
                  <div class="calendar-weekday">Пн</div>
                  <div class="calendar-weekday">Вт</div>
                  <div class="calendar-weekday">Ср</div>
                  <div class="calendar-weekday">Чт</div>
                  <div class="calendar-weekday">Пт</div>
                  <div class="calendar-weekday">Сб</div>
                  <div class="calendar-weekday">Вс</div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
              </div>
            </div>
            <button class="icon-button" id="prevEvent" type="button" title="Предыдущее событие" aria-label="Предыдущее событие">‹</button>
            <button class="icon-button" id="nextEvent" type="button" title="Следующее событие" aria-label="Следующее событие">›</button>
            <div class="position" id="position">0 / 0</div>
          </div>
        </div>
      </div>
    </section>

    <section class="workspace">
      <div class="charts">
        <article class="chart">
          <h2 class="chart-title">Отслеживание билетов MAX</h2>
          <div class="chart-frame-wrap">
            <iframe class="chart-frame" id="maxTicketsFrame" title="Отслеживание билетов MAX" allowfullscreen></iframe>
          </div>
        </article>

        <article class="chart">
          <h2 class="chart-title">Отслеживание цены продаж всех категорий MAX</h2>
          <div class="chart-frame-wrap">
            <iframe class="chart-frame" id="maxPriceFrame" title="Отслеживание цены продаж всех категорий MAX" allowfullscreen></iframe>
          </div>
        </article>

        <div class="block-divider" aria-hidden="true"></div>

        <article class="chart">
          <h2 class="chart-title">Отслеживание билетов</h2>
          <div class="chart-frame-wrap">
            <iframe class="chart-frame" id="ticketsFrame" title="Отслеживание билетов" allowfullscreen></iframe>
          </div>
        </article>

        <article class="chart">
          <h2 class="chart-title">Отслеживание всех категорий</h2>
          <div class="chart-frame-wrap">
            <iframe class="chart-frame" id="allCategoriesFrame" title="Отслеживание всех категорий" allowfullscreen></iframe>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const CHARTS = [
      {
        frameId: "maxTicketsFrame",
        baseUrl: "https://datalens.yandex/i1bvc2rk1gyw2",
      },
      {
        frameId: "maxPriceFrame",
        baseUrl: "https://datalens.yandex/l4f7v9hp1g9a5",
      },
      {
        frameId: "ticketsFrame",
        baseUrl: "https://datalens.yandex/3jbj88gnek4un",
      },
      {
        frameId: "allCategoriesFrame",
        baseUrl: "https://datalens.yandex/euo4f8jr1ff8y",
      },
    ];

    const PARAMS = {
      category: "ticket_category_tdzf",
      event: "event_id_internal_9r0j",
    };

    const EVENT_OPTIONS = [
      "2026-05-28 20:00:00",
      "2026-05-29 20:00:00",
      "2026-05-30 20:00:00",
      "2026-05-31 18:00:00",
      "2026-06-02 20:00:00",
      "2026-06-03 20:00:00",
      "2026-06-04 20:00:00",
      "2026-06-05 20:00:00",
      "2026-06-06 20:00:00",
      "2026-06-07 18:00:00",
      "2026-06-09 20:00:00",
      "2026-06-10 20:00:00",
      "2026-06-11 20:00:00",
      "2026-06-12 20:00:00",
      "2026-06-13 20:00:00",
      "2026-06-14 18:00:00",
      "2026-06-16 20:00:00",
      "2026-06-17 20:00:00",
      "2026-06-18 20:00:00",
      "2026-06-19 20:00:00",
      "2026-06-20 20:00:00",
      "2026-06-21 18:00:00",
      "2026-06-23 20:00:00",
      "2026-06-24 20:00:00",
      "2026-06-25 20:00:00",
      "2026-06-26 20:00:00",
      "2026-06-27 20:00:00",
      "2026-06-28 18:00:00",
      "2026-06-30 20:00:00",
      "2026-07-01 20:00:00",
      "2026-07-02 20:00:00",
      "2026-07-03 20:00:00",
      "2026-07-04 20:00:00",
      "2026-07-05 18:00:00",
      "2026-07-07 20:00:00",
      "2026-07-08 20:00:00",
      "2026-07-09 20:00:00",
      "2026-07-10 20:00:00",
      "2026-07-11 20:00:00",
      "2026-07-12 18:00:00",
      "2026-07-14 20:00:00",
      "2026-07-15 20:00:00",
      "2026-07-16 20:00:00",
      "2026-07-17 20:00:00",
      "2026-07-18 20:00:00",
      "2026-07-19 18:00:00",
      "2026-07-21 20:00:00",
      "2026-07-22 20:00:00",
      "2026-07-23 20:00:00",
      "2026-07-24 20:00:00",
      "2026-07-25 20:00:00",
      "2026-07-26 18:00:00",
      "2026-07-28 20:00:00",
      "2026-07-29 20:00:00",
      "2026-07-30 20:00:00",
      "2026-07-31 20:00:00",
    ];

    const selectors = {
      fileWarning: document.getElementById("fileWarning"),
      category: document.getElementById("ticketCategory"),
      eventDate: document.getElementById("eventDate"),
      eventDateValue: document.getElementById("eventDateValue"),
      weekdayBadge: document.getElementById("weekdayBadge"),
      eventDatePicker: document.getElementById("eventDatePicker"),
      eventCalendar: document.getElementById("eventCalendar"),
      calendarMonth: document.getElementById("calendarMonth"),
      calendarGrid: document.getElementById("calendarGrid"),
      prevMonth: document.getElementById("prevMonth"),
      nextMonth: document.getElementById("nextMonth"),
      prev: document.getElementById("prevEvent"),
      next: document.getElementById("nextEvent"),
      position: document.getElementById("position"),
      frames: CHARTS.map((chart) => document.getElementById(chart.frameId)),
    };

    let currentEventIndex = 0;
    let selectedEventDate = "";
    let calendarViewDate = null;
    const EVENT_DATE_TO_INDEX = new Map(EVENT_OPTIONS.map((eventValue, index) => [getEventDate(eventValue), index]));
    const MONTH_FORMATTER = new Intl.DateTimeFormat("ru-RU", { month: "long", year: "numeric" });
    const WEEKDAY_FORMATTER = new Intl.DateTimeFormat("ru-RU", { weekday: "long" });

    if (window.location.protocol === "file:") {
      selectors.fileWarning.hidden = false;
    }

    function getEventDate(eventValue) {
      return eventValue.slice(0, 10);
    }

    function dateKeyFromParts(year, month, day) {
      return [
        year,
        String(month + 1).padStart(2, "0"),
        String(day).padStart(2, "0"),
      ].join("-");
    }

    function dateFromKey(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatWeekday(value) {
      if (!value) {
        return "";
      }

      const weekday = WEEKDAY_FORMATTER.format(dateFromKey(value));
      return weekday.charAt(0).toUpperCase() + weekday.slice(1);
    }

    function monthKey(date) {
      return dateKeyFromParts(date.getFullYear(), date.getMonth(), 1);
    }

    function todayKey() {
      const now = new Date();
      return dateKeyFromParts(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function getEventIndex(value) {
      return EVENT_OPTIONS.findIndex((eventValue) => eventValue === value);
    }

    function getEventIndexByDate(value) {
      return EVENT_DATE_TO_INDEX.has(value) ? EVENT_DATE_TO_INDEX.get(value) : -1;
    }

    function getSelectedEventValue() {
      const index = getEventIndexByDate(selectedEventDate);
      if (index >= 0) {
        return EVENT_OPTIONS[index];
      }
      return selectedEventDate ? `${selectedEventDate} 20:00:00` : "";
    }

    function syncIndexFromInput() {
      const index = getEventIndexByDate(selectedEventDate);
      if (index >= 0) {
        currentEventIndex = index;
      }
      return index;
    }

    function buildChartUrl(baseUrl) {
      const url = new URL(baseUrl);
      url.searchParams.set(PARAMS.event, getSelectedEventValue());
      if (selectors.category.value) {
        url.searchParams.set(PARAMS.category, selectors.category.value);
      } else {
        url.searchParams.set(PARAMS.category, "");
      }
      url.searchParams.set("_embedded", "1");
      url.searchParams.set("_no_controls", "1");
      url.searchParams.set("_theme", "dark");
      return url.toString();
    }

    function updateNavigation() {
      const knownEvent = syncIndexFromInput();
      selectors.prev.disabled = EVENT_OPTIONS.length < 2 || currentEventIndex <= 0;
      selectors.next.disabled = EVENT_OPTIONS.length < 2 || currentEventIndex >= EVENT_OPTIONS.length - 1;
      selectors.position.textContent = knownEvent >= 0
        ? `${currentEventIndex + 1} / ${EVENT_OPTIONS.length}`
        : `вне списка / ${EVENT_OPTIONS.length}`;
    }

    function setSelectedDate(value) {
      selectedEventDate = value;
      selectors.eventDateValue.textContent = value;
      selectors.weekdayBadge.textContent = formatWeekday(value);
      calendarViewDate = value ? dateFromKey(value) : null;
    }

    function openCalendar() {
      selectors.eventCalendar.hidden = false;
      selectors.eventDate.setAttribute("aria-expanded", "true");
      renderCalendar();
    }

    function closeCalendar() {
      selectors.eventCalendar.hidden = true;
      selectors.eventDate.setAttribute("aria-expanded", "false");
    }

    function toggleCalendar() {
      if (selectors.eventCalendar.hidden) {
        openCalendar();
      } else {
        closeCalendar();
      }
    }

    function renderCalendar() {
      if (!calendarViewDate && selectedEventDate) {
        calendarViewDate = dateFromKey(selectedEventDate);
      }

      const viewDate = calendarViewDate || dateFromKey(getEventDate(EVENT_OPTIONS[0]));
      const viewYear = viewDate.getFullYear();
      const viewMonth = viewDate.getMonth();
      const firstDay = new Date(viewYear, viewMonth, 1);
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const leadingEmpty = (firstDay.getDay() + 6) % 7;
      const minMonth = monthKey(dateFromKey(getEventDate(EVENT_OPTIONS[0])));
      const maxMonth = monthKey(dateFromKey(getEventDate(EVENT_OPTIONS[EVENT_OPTIONS.length - 1])));
      const currentMonth = monthKey(viewDate);
      const selectedDate = selectedEventDate;
      const currentToday = todayKey();

      selectors.calendarMonth.textContent = MONTH_FORMATTER.format(firstDay);
      selectors.prevMonth.disabled = currentMonth <= minMonth;
      selectors.nextMonth.disabled = currentMonth >= maxMonth;
      selectors.calendarGrid.innerHTML = "";

      for (let index = 0; index < leadingEmpty; index += 1) {
        const emptyCell = document.createElement("button");
        emptyCell.className = "calendar-day is-empty";
        emptyCell.type = "button";
        emptyCell.disabled = true;
        emptyCell.tabIndex = -1;
        selectors.calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const dateValue = dateKeyFromParts(viewYear, viewMonth, day);
        const dayButton = document.createElement("button");
        dayButton.className = "calendar-day";
        dayButton.type = "button";
        dayButton.textContent = String(day);
        dayButton.dataset.date = dateValue;
        dayButton.disabled = !EVENT_DATE_TO_INDEX.has(dateValue);

        if (dateValue === selectedDate) {
          dayButton.classList.add("is-selected");
        }

        if (dateValue === currentToday) {
          dayButton.classList.add("is-today");
        }

        if (!dayButton.disabled) {
          dayButton.addEventListener("click", () => {
            setSelectedDate(dateValue);
            closeCalendar();
            renderCharts();
          });
        }

        selectors.calendarGrid.appendChild(dayButton);
      }
    }

    function renderCharts() {
      updateNavigation();
      renderCalendar();
      CHARTS.forEach((chart, index) => {
        const nextSrc = buildChartUrl(chart.baseUrl);
        if (selectors.frames[index].src !== nextSrc) {
          selectors.frames[index].src = nextSrc;
        }
      });
      document.body.focus();
    }

    function moveEvent(direction) {
      if (!EVENT_OPTIONS.length) {
        return;
      }

      syncIndexFromInput();
      const nextIndex = Math.min(Math.max(currentEventIndex + direction, 0), EVENT_OPTIONS.length - 1);
      if (nextIndex === currentEventIndex && selectedEventDate === getEventDate(EVENT_OPTIONS[nextIndex])) {
        return;
      }

      currentEventIndex = nextIndex;
      setSelectedDate(getEventDate(EVENT_OPTIONS[currentEventIndex]));
      renderCharts();
    }

    function setInitialValues() {
      const params = new URLSearchParams(window.location.search);
      const categoryFromUrl = params.get("category");
      const eventFromUrl = params.get("event");

      if (categoryFromUrl !== null) {
        selectors.category.value = categoryFromUrl;
      }

      if (eventFromUrl && getEventIndex(eventFromUrl) >= 0) {
        currentEventIndex = getEventIndex(eventFromUrl);
        setSelectedDate(getEventDate(eventFromUrl));
        return;
      }

      const now = new Date();
      const todayPrefix = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
      ].join("-");
      const todayIndex = EVENT_OPTIONS.findIndex((eventValue) => eventValue.startsWith(todayPrefix));
      if (todayIndex >= 0) {
        currentEventIndex = todayIndex;
        setSelectedDate(getEventDate(EVENT_OPTIONS[todayIndex]));
        return;
      }

      const nextIndex = EVENT_OPTIONS.findIndex((eventValue) => eventValue.slice(0, 10) >= todayPrefix);
      currentEventIndex = nextIndex >= 0 ? nextIndex : EVENT_OPTIONS.length - 1;
      setSelectedDate(EVENT_OPTIONS[currentEventIndex] ? getEventDate(EVENT_OPTIONS[currentEventIndex]) : "");
    }

    function setupEventDatePicker() {
      selectors.eventDate.addEventListener("click", toggleCalendar);
      selectors.prevMonth.addEventListener("click", () => {
        calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() - 1, 1);
        renderCalendar();
      });
      selectors.nextMonth.addEventListener("click", () => {
        calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + 1, 1);
        renderCalendar();
      });
    }

    selectors.prev.addEventListener("click", () => moveEvent(-1));
    selectors.next.addEventListener("click", () => moveEvent(1));
    selectors.category.addEventListener("change", renderCharts);
    selectors.eventDate.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleCalendar();
      }

      if (event.key === "Escape") {
        closeCalendar();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveEvent(-1);
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveEvent(1);
      }
    });

    window.addEventListener("pointerdown", (event) => {
      if (!selectors.eventDatePicker.contains(event.target)) {
        closeCalendar();
      }

      if (event.target.tagName !== "INPUT" && event.target.tagName !== "SELECT" && event.target.tagName !== "BUTTON") {
        document.body.focus();
      }
    });
    setupEventDatePicker();
    setInitialValues();
    renderCharts();
  </script>
</body>
</html>
