services:
  app:
    build: .
    container_name: graphics_visible
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 80
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MONGO_DB: ${MONGO_DB:-planetra_dashboards}
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGO_ROOT_USER:-dashboards_admin}:${MONGO_ROOT_PASSWORD:-}@mongo:27017/${MONGO_DB:-planetra_dashboards}?authSource=admin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ODEON_USERNAME: ${ODEON_USERNAME:-odeon_manager}
      ODEON_PASSWORD: ${ODEON_PASSWORD:-}
      PUBLIC_MONGO_USERNAME: ${PUBLIC_MONGO_USERNAME:-dashboards_user}
      PUBLIC_MONGO_PASSWORD: ${PUBLIC_MONGO_PASSWORD:-}
      ETL_EXECUTION_MODE: external
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"
    networks:
      - graphics_visible

  etl_scripts:
    build:
      context: .
      dockerfile: Dockerfile.etl
    container_name: graphics_visible_etl_scripts
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${ETL_LOG_LEVEL:-INFO}
      ETL_POLL_SECONDS: ${ETL_POLL_SECONDS:-3}
      MONGO_DB: ${MONGO_DB:-planetra_dashboards}
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGO_ROOT_USER:-dashboards_admin}:${MONGO_ROOT_PASSWORD:-}@mongo:27017/${MONGO_DB:-planetra_dashboards}?authSource=admin}
      PLANETRA_DB_HOST: ${PLANETRA_DB_HOST:-}
      PLANETRA_DB_PORT: ${PLANETRA_DB_PORT:-}
      PLANETRA_DB_NAME: ${PLANETRA_DB_NAME:-}
      PLANETRA_DB_USER: ${PLANETRA_DB_USER:-}
      PLANETRA_DB_PASSWORD: ${PLANETRA_DB_PASSWORD:-}
    networks:
      - graphics_visible

  mongo:
    image: mongo:7
    container_name: graphics_visible_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-dashboards_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes:
      - graphics_visible_mongo:/data/db
    ports:
      - "${MONGO_HOST:-127.0.0.1}:${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - graphics_visible

volumes:
  graphics_visible_mongo:

networks:
  graphics_visible:
    name: graphics_visible_network
