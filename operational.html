<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оперативный дашборд для ежедневного контроля</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101318;
      --panel: #171c23;
      --border: #323c48;
      --text: #eef3f8;
      --muted: #9aa6b5;
      --accent: #4aa3ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px clamp(14px, 2vw, 24px);
      border-bottom: 1px solid var(--border);
      background: rgba(23, 28, 35, 0.98);
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: 0;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .button {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: #202731;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .button:hover,
    .button:focus-visible {
      border-color: var(--accent);
      background: #243140;
      outline: none;
    }

    .frame-wrap {
      min-width: 0;
      min-height: 0;
      background: #1f2022;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #1f2022;
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .actions {
        justify-content: stretch;
      }

      .button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">
        <h1>Оперативный дашборд для ежедневного контроля</h1>
        <div class="status" id="status">Загрузка дашборда...</div>
      </div>
      <div class="actions">
        <button class="button" type="button" id="refreshButton">Обновить</button>
        <a class="button" href="https://datalens.yandex/i0yioelotv302?event_id_internal_9r0j=&ticket_category_tdzf=" target="_blank" rel="noopener">Открыть в DataLens</a>
      </div>
    </header>

    <section class="frame-wrap" aria-label="Оперативный дашборд">
      <iframe id="dashboardFrame" title="Оперативный дашборд для ежедневного контроля" allowfullscreen></iframe>
    </section>
  </main>

  <script>
    const BASE_DASHBOARD_URL = "https://datalens.yandex/i0yioelotv302";
    const frame = document.getElementById("dashboardFrame");
    const status = document.getElementById("status");
    const refreshButton = document.getElementById("refreshButton");

    function buildDashboardUrl() {
      const url = new URL(BASE_DASHBOARD_URL);
      url.searchParams.set("event_id_internal_9r0j", "");
      url.searchParams.set("ticket_category_tdzf", "");
      url.searchParams.set("_embedded", "1");
      url.searchParams.set("_no_controls", "1");
      url.searchParams.set("_theme", "dark");
      return url.toString();
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      }).format(date);
    }

    function refreshDashboard() {
      frame.src = buildDashboardUrl();
      status.textContent = `Обновлено: ${formatTime(new Date())}`;
    }

    refreshButton.addEventListener("click", refreshDashboard);
    refreshDashboard();
  </script>
</body>
</html>
